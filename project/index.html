<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%236366f1'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Placement Cell Portal</title>
    <script>
      // Apply the saved theme BEFORE any CSS or React loads, so the very
      // first painted frame already has the correct colors. Without this,
      // the :root defaults (dark) paint first, then React's useLayoutEffect
      // swaps to light/aurora a frame later — a visible color flash on
      // every refresh, most noticeable on the sidebar.
      (function () {
        try {
          var t = localStorage.getItem('spc-theme');
          if (t !== 'light' && t !== 'aurora') t = 'dark';
          document.documentElement.classList.add('theme-' + t);
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

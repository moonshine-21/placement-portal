version: "3.8"

# Run with: docker compose up -d
# Stop with: docker compose down
services:
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host # simplest for UDP relay port ranges — coturn needs
    # to bind a wide range of UDP ports (min-port..max-port in
    # turnserver.conf), which is awkward to map individually in bridge mode.
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # If you set up TLS certs (see README), also mount them, e.g.:
      # - ./cert.pem:/etc/coturn/cert.pem:ro
      # - ./privkey.pem:/etc/coturn/privkey.pem:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

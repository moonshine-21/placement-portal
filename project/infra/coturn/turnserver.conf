# coturn config — self-hosted TURN server, no third-party bandwidth cap.
# Deploy this on any always-on VPS (Oracle Cloud's "Always Free" tier works
# well: it's genuinely free forever and includes ~10TB/month outbound
# bandwidth, which is effectively unlimited for a college portal's call
# volume). See ../README.md in this folder for full setup steps.

# --- Networking ---
listening-port=3478
tls-listening-port=5349
# Replace with your VPS's actual public IP (or leave external-ip out if the
# VPS has no NAT in front of it, e.g. most cloud VPS providers).
# external-ip=YOUR_SERVER_PUBLIC_IP

# Port range used for relaying actual call media. Must be opened in your
# VPS's firewall/security-group rules (UDP).
min-port=49152
max-port=65535

# --- Auth: time-limited credentials, no database needed ---
# The server and your Vercel function share this one secret. Your serverless
# function (api/turn-credentials.js) computes short-lived username/password
# pairs from it — coturn verifies them the same way. Generate a strong random
# value once, e.g.: openssl rand -hex 32
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
realm=your-domain-or-ip

# --- Hardening ---
fingerprint
lt-cred-mech
no-cli
no-tlsv1
no-tlsv1_1
# Don't let the TURN server relay to your own private/internal network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# --- TLS (optional but recommended so calls work on networks that block
# plain UDP/TCP TURN — get a free cert with certbot, see README) ---
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem

# --- Logging ---
log-file=stdout
